name: CitasApp CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore CitasApp.slnx

      - name: Build solution
        run: dotnet build CitasApp.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test CitasApp.slnx --configuration Release --no-build --verbosity normal
